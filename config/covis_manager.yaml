%YAML 1.0
# ================================================================
# Covis Manager 配置文件
# 文件路径: config/covis_manager.yaml
# 模块: 前端 - 共视图管理与局部 BA
# ================================================================
#
# 功能说明：
#   CovisManager 管理关键帧滑动窗口和地图点（候选/已确认），
#   负责：
#   1. 候选地图点的共视聚合与校验
#   2. 已确认地图点的管理（淘汰、重投影匹配）
#   3. 局部 BA（Bundle Adjustment）优化
#   4. 回环检测触发与 PGO 位姿修正
#
# ================================================================

# ================================================================
# 一、关键帧滑动窗口参数
# ================================================================

# 关键帧滑动窗口大小。
# 窗口越大 BA 优化范围越大，但计算量也越大。
# 同时也影响共视地图点的历史回溯深度。
# 建议值：
#   - 实时 SLAM（嵌入式/移动端）：5-7
#   - 桌面/服务器：7-10
window_size: 15


# ================================================================
# 二、地图点管理参数
# ================================================================

# 共视校验最少帧数：候选地图点需要被至少多少个关键帧共同观测才能升级为已确认。
# 提高此值会减少误确认（更严格），但确认点数量减少。
# 设为 1 = 至少被 1 个关键帧观测到（极宽松，快速增加确认点数量）。
# 设为 2 = 至少被 2 个关键帧（标准共视策略）。
# ★★★ 从 2 降低到 1：关键帧间隔增大（20帧/关键帧）导致候选点被少数关键帧看到，
#   原 min_covis_frames=2 过于严格，确认点只有 4-6 个。
#   改为 1 允许单关键帧确认，快速建立初始共视图。
min_covis_frames: 1

# 候选地图点确认阈值：候选点被多少个关键帧观测到后升级为已确认。
# 值为 1 = 被 1 个关键帧观测到即可确认（宽松，候选少时快速确认）。
# 值为 2 = 被 2 个关键帧（标准，确保共视约束）。
# 值为 3 = 被 3 个关键帧（严格，减少误确认）。
# 建议值：2-3。
# ★★★ 从 2 降低到 1：与 min_covis_frames=1 配合，允许快速确认 ★★★
candidate_confirm_threshold: 1

# 重投影误差上限（像素）。超过此阈值的地图点不参与 PnP 求解。
# 注意：此参数同时用于 BA 中的地图点筛选。
# 旧值 8.0 过于严格，导致确认点被频繁误删（每轮 reproj=10~90 个）。
# 室内 TUM 数据集纹理丰富，正常 BA 优化后大量点误差仍在 8~15px 区间。
# ★★★ 从 8.0 放宽到 15.0：减少误删，让确认点稳定积累 ★★★
max_reproj_error: 15.0

# 候选地图点最大数量（内存上限）。
# 超过此数量后不再接受新候选（通过淘汰机制清除）。
# 设为 0 = 无限制。
# 建议值：
#   - 实时 SLAM：1000-2000
#   - 离线处理：5000-10000
# ★★★ 从 1000 提高到 3000：与 max_confirmed=2000 配合，预留更多候选空间 ★★★
max_candidates: 3000

# 已确认地图点最大数量（内存上限）。
# 超过此数量后不再新增（停止建图）。
# 设为 0 = 无限制。
# 建议值：
#   - 实时 SLAM：300-500
#   - 离线处理：5000-20000
# ★★★ 从 500 提高到 2000：离线 TUM 数据集处理需要更大的地图容量 ★★★
#   原始 500 太小，候选点频繁被截断，影响回环时的共视匹配质量
max_confirmed: 2000

# 候选点检查间隔（帧数）。
# 每隔 N 帧检查一次候选点，执行共视聚合、校验、淘汰。
# 值越小检查越频繁（CPU 开销大），值越大延迟越高。
# 建议值：5-10。
# ★★★ 从 5 提高到 10：减少 cullCandidates 频率，避免候选点过早被淘汰 ★★★
candidate_check_interval: 10

# 候选/确认点老化阈值（帧数）。
# 超过 N 帧未被任何关键帧观测到的点被淘汰（stale culling）。
# TUM RGB-D（30fps）：50帧≈1.6秒，室内桌面场景相机移动慢，点常被遮挡
# 旧值 50 导致确认点被频繁误删（每轮 stale=30~90 个），确认点无法积累。
# ★★★ 从 200 大幅降低到 60 ★★★
# 原值 200 导致：fr1_desk2 关键帧间隔约 55 帧，历史关键帧被窗口淘汰后 200 帧后确认点全被删除，
# matched_kf 的确认点在回环检测时已不存在，导致 last_matched_kf_covis_mp_ids_ 永远为空。
# 60 帧（约 2 秒@30fps）允许室内静态场景有足够的陈旧容忍度。
staleness_thresh: 60

# 两点是否来自同一物理点的判断阈值（米）。
# 3D 位置距离小于此值的两个候选点被认为是同一个物理点。
# 设为 0.05-0.15m。
# 建议值：0.10m。
same_point_distance_threshold: 0.10


# ================================================================
# 三、共视量化参数
# ================================================================
#
# 背景：为避免每次向地图添加点时遍历全部已有地图点做 3D 最近邻（O(N)），
# 使用整数哈希将 3D 坐标量化到 5cm 格网，实现 O(1) 查找。
# 格式：x(21bits)|y(21bits)|z(21bits)，每分量约 ±1km 范围。
#
# 量化精度影响：
#   - 过粗（> 10cm）：不同物理点被错误合并
#   - 过细（< 2cm）：同一物理点被错误区分（重复地图点）

# 3D 坐标量化比例：1m / 格网尺寸（米）。
# 设为 20.0 = 5cm 格网（1m / 20 = 0.05m）。
# 建议值：15.0-25.0（对应 6.7cm-4cm 格网）。
quantize_scale: 20.0


# ================================================================
# 四、重投影搜索参数
# ================================================================

# ★★★ 图像分辨率 ★★★
# 用于重投影边界检查。必须与实际相机分辨率匹配！
# 错误设置会导致点被错误地判定为「图像外」而被跳过。
# TUM RGB-D: 640x480
img_width: 640
img_height: 480

# 重投影搜索半径（像素）。
# 在 3D 点重投影位置附近以此半径搜索匹配的特征点。
# 值越大搜索范围越大（能找到更多匹配），但误匹配概率也越高。
# 建议值：
#   - 室内近距离：8-12px
#   - 户外远距离：15-25px
#   ★★★ 从 12.0px 扩大到 25.0px：减少前端漂移导致的重投影误差 ★★★
reproj_search_radius: 25.0


# ================================================================
# 五、局部 BA 参数
# ================================================================
#
# 背景：局部 BA 在关键帧窗口内同时优化位姿和地图点。
# 当前实现固定所有关键帧位姿（setFixed(true)），
# BA 只优化地图点，无法修正轨迹漂移。
#
# 如需让 BA 参与位姿修正，需实现分层松弛策略：
#   - 最新关键帧：固定（保证尺度）
#   - 较老关键帧：固定但允许 Schur 边缘化间接修正
#
# 注意：BA 优化器的 g2o 配置目前无法从 YAML 加载（需要 g2o API）。

# BA 最小边数阈值。
# 只有当 BA 边数（关键帧-地图点观测对应）≥ 此值时才执行 BA。
# 设为 0 = 始终执行（可能导致小窗口时 BA 不稳定）。
# 建议值：
#   - 大窗口（≥ 7）：10-15
#   - 小窗口（≤ 5）：5-10
ba_min_edges: 10

# BA 最大迭代次数。
# g2o Levenberg-Marquardt 最多迭代 N 次后停止。
# 建议值：10-30。
ba_max_iterations: 20


# ================================================================
# 六、回环检测参数
# ================================================================

# 回环检测触发间隔（帧数）。
# 每隔 N 帧执行一次回环检测。
# 值越小检测越频繁（CPU 开销大），值越大延迟越高。
# 建议值：5-10。
# ★★★ 纯 VO 模式：设为 9999，几乎不触发回环检测 ★★★
loop_detection_interval: 9999

# 回环检测最低内点数门槛。
# 只有当几何验证内点数 ≥ 此值时才接受回环。
# 从 12 降低到 8，以允许 8+ 内点回环通过，阻止 5 内点垃圾回环。
# 建议值：
#   - 宽松（多回环）：5-6
#   - 严格（少误检）：10-15
# ★★★ 严格（少误检）：10-15（8 为原默认值） ★★★
loop_min_inliers: 8

# ICP 回环距离阈值（米）。
# ICP 验证通过后，相对位姿的平移量应在合理范围内。
# 室内场景（fr1_desk2）：相机运动半径约 5-8m，回环时两帧距离通常 2-6m。
# 设得太小（如 3.0m）会误杀真实回环；设得太大（如 10.0m）会让误检通过。
# ★★★ 从 3.0m 放宽到 6.0m：原值导致大量 ICP 回环因室内房间跨度被误杀 ★★★
icp_loop_max_distance_m: 6.0

# 是否启用回环检测。
# false = 完全禁用回环检测和 PGO。
# true = 启用回环检测（需要 LoopDetector 和 PoseGraphOptimizer）。
# ★★★ 纯 VO 模式：强制设为 false，完全禁用回环检测 ★★★
enable_loop_detection: false


# ================================================================
# 七、PGO 位姿修正参数
# ================================================================
#
# 背景：PGO（Pose Graph Optimization）利用回环约束优化所有关键帧位姿。
# PGO 修正后可能幅度过大（PGO 认为的最优解与真实轨迹偏差大），
# 需要通过阈值过滤掉过大的修正，防止破坏已有轨迹。
#
# 修正过大原因分析：
#   1. 回环候选质量差（内点少，比率低）
#   2. Essential Matrix 模式无尺度（平移方向对但尺度错）
#   3. PGO 里程计边权重过高，拉偏了回环约束
#
# 当前策略：检测到修正过大（> 阈值）时拒绝回环修正，保留原始 PnP 轨迹。

# PGO 修正 - 最大允许平移修正（米）。
# 单个关键帧的位姿修正超过此值时，拒绝整次回环修正。
# 设为 0.0 = 拒绝所有修正。
# 设为 10.0 = 允许任意修正（不推荐，EM 模式修正可能 > 1m）。
# 建议值：
#   - RGB-D（有尺度约束）：0.3-0.5m
#   - 单目（无尺度）：0.5-1.0m
#   ★★★ 从 1.0m 放宽到 2.0m：回环修正应该允许更大的平移调整 ★★★
#   室内 fr1_desk2 场景，正常回环修正可能达到 0.5-1.5m。
#   设为 2.0m 允许合理偏差同时过滤误检。
pgo_max_allowed_trans_corr: 2.0

# PGO 修正 - 最大允许旋转修正（度）。
# 单个关键帧的位姿修正超过此角度时，拒绝整次回环修正。
# 设为 180.0 = 允许任意旋转（通常不触发）。
# 注意：此参数作为上限，pgo_max_allowed_rot_corr_deg_reject 是真正的拒绝阈值。
pgo_max_allowed_rot_corr_deg: 180.0

# ★★★ PGO 修正 - 旋转修正拒绝阈值（度）★★★
# 超过此值的旋转修正是异常的，正常回环修正的旋转通常 < 30°。
# 设为 50°：从 20° 提高到 50°，因为当 ICP+dummy_matches 问题被修复后，
#   正确的回环修正应该主要由旋转较小的平移误差构成（EM 模式）。
#   但在 ICP 路径修复前，实际的 38.6° 旋转是 ICP 错误产生的，需要从源头修复 ICP。
pgo_max_allowed_rot_corr_deg_reject: 50.0

# PGO 修正 - 平移警告阈值（米）。
# 修正超过此值时输出警告日志（提示可能有问题）。
# 设为 0.0 = 禁用警告。
# ★★★ 放宽到 2.0m：与 pgo_max_allowed_trans_corr=5.0 配合。
#   警告阈值 < 最大阈值才有意义。
pgo_warn_trans_corr: 2.0

# PGO 修正 - 旋转警告阈值（度）。
# 修正超过此角度时输出警告日志。
pgo_warn_rot_corr_deg: 45.0

# 是否启用 PGO 回环修正。
# false = 保留原始 PnP 轨迹，不执行 PGO 位姿优化。
# true = 执行 PGO 优化，并根据阈值决定是否接受修正。
# 注意：EM 回环（Essential Matrix）没有真实尺度，PGO 倾向于拉大尺度。
# 对 RGB-D（已有深度约束），禁用 PGO 改用原始 PnP 轨迹更可靠。
# ★★★ 注意：enable_pgo 的实际值由 tracking.yaml 统一控制（tracking.cpp:81 继承）
# 此处仅作文档说明，不覆盖 tracking.yaml 的配置。
# enable_pgo: true

# 是否启用局部 BA。
# false = 完全禁用 BA，保留纯 PnP 轨迹。
# true = 在关键帧时执行局部 BA（优化地图点，关键帧位姿固定）。
# ★★★ 启用局部 BA：修正关键帧位姿漂移，提升轨迹精度 ★★★
enable_local_ba: true

# 详细日志开关（默认 false）。
# true = 打印所有 PGO/Covis Loop/BA 诊断日志（每关键帧大量输出）。
# false = 只在发生重要事件时打印（回环检测到/回环修正等）。
verbose: true
