%YAML 1.0
# ================================================================
# Loop Detector 配置文件
# 文件路径: config/loop_detector.yaml
# 模块: 回环检测 - 循环检测核心参数
# ================================================================
#
# 功能说明：
#   回环检测器整合 DBoW2 风格的位置识别和几何验证：
#   1. DBoW2 预过滤 → BoW 向量匹配找到候选历史关键帧
#   2. 描述子匹配 → 在候选帧中找到 2D-2D / 3D-3D 对应
#   3. 几何验证 → ICP 3D-3D / Essential Matrix / Homography 验证
#   4. 多候选验证 → 验证多个候选，选择最优者
#   5. 候选选择 → 综合质量分数选择最佳回环
#
# 调参优先级：
#   P0: min_loop_separation, min_geometric_inliers
#   P1: candidate_pool_size, enable_multi_candidate_verification
#   P2: max_match_distance, ransac_threshold_px
#
# ================================================================

# ================================================================
# 一、时间约束参数
# ================================================================

# 候选帧与当前帧的最小关键帧间隔。
# 作用：避免与最近邻误匹配（时间上太近的两帧 BoW 分数会很高）。
# ★★★ 从 60 降低到 30 ★★★
# fr1_desk2 总共 640 帧（21秒），关键帧间隔约 55 帧，共约 11 个关键帧。
# 原值 60 导致只有少数历史帧可作为回环候选，候选池太小。
# 改为 30 保证足够的候选帧，同时避免相邻关键帧之间的误回环。
min_loop_separation: 30


# ================================================================
# 二、描述子匹配参数
# ================================================================

# NN 匹配距离阈值（ORB 描述子汉明距离，范围 0~256）。
# 值越小匹配越严格，误匹配越少，但匹配数也越少。
# 室内近距离（< 5m）：60-100；户外远距离（> 10m）：100-150。
max_match_distance: 80

# Lowe 比率过滤阈值（KNN 第一近邻与第二近邻距离比）。
# 1.0 = 禁用 Lowe 过滤（交叉一致性检查已足够）。
# < 1.0 = 启用 Lowe 过滤，值越小越严格。
# 建议值：
#   - 室内慢速场景：0.75-0.85（宽松，增加匹配数）
#   - 户外快速/重复纹理：0.60-0.70（严格，减少误匹配）
#   - TUM 数据集：0.75-1.0（通常禁用 Lowe）
lowe_ratio_threshold: 1.0


# ================================================================
# 三、BoW 预过滤参数
# ================================================================

# BoW 向量匹配的最小公共词数量。
# 两帧的 BoW vector 至少有这么多公共词才进入后续验证。
# 设为 0 禁用此过滤。
# 注意：此参数在 Tracking.cpp 中运行时覆盖为 10。
# 建议值：
#   - 稠密 BoW（高分支因子 k=10）：6-10
#   - 稀疏 BoW（低分支因子 k=5）：3-5
min_common_words: 6


# ================================================================
# 四、几何验证参数
# ================================================================

# ⚠ RANSAC 迭代次数与内点阈值（ransac_iterations / threshold_px）已移到
#   config/geometric_verifier.yaml —— 那是几何验证器读取的唯一来源。
#   本文件曾有同名条目，构造函数会覆盖进去，导致 geometric_verifier.yaml 配了不生效。

# 几何校验通过的最低内点数。
# 此参数在 Tracking.cpp 中运行时覆盖为 5。
# 建议值：
#   - 室内场景（匹配数少 5-15）：3-4
#   - 户外场景（匹配数多 20-50）：8-12
# ★★★ 户外场景（匹配数多 20-50）：8-12（5 为原默认值） ★★★
min_geometric_inliers: 5

# ⚠ max_icp_inlier_ratio 同上，唯一来源是 config/geometric_verifier.yaml。


# ================================================================
# 五、候选池参数
# ================================================================

# 候选帧池大小：从最近 N 个历史关键帧中选 BoW 匹配候选。
# 设为 0 使用全部历史帧（不推荐，慢）。
# 注意：此参数在 Tracking.cpp 中运行时覆盖为 100。
# 建议值：
#   - 小场景（< 1000 关键帧）：30-50
#   - 大场景（> 1000 关键帧）：50-100
candidate_pool_size: 30


# ================================================================
# 六、多候选验证参数
# ================================================================
#
# 背景：单候选验证（只验证 BoW 分数最高的帧）容易被假阳性欺骗。
# 多候选验证：验证前 N 个候选，选择几何一致性最好的。
# 效果：显著减少误检，但计算量增加 N 倍。
#
# 示例（KF=10, KF=5 都通过几何验证）：
#   KF=10: 内点 6，比率 46.2%，质量分 21.45
#   KF=5:  内点 5，比率 55.6%，质量分 18.45
#   → 选择 KF=10（质量分更高）

# 是否启用多候选验证（推荐开启，减少误检）。
enable_multi_candidate_verification: true

# 最多验证多少个候选帧。
# 值越大越能选出最佳候选，但计算量也越大。
# 建议值：3-10。通常 3-5 个足够。
max_candidates_to_verify: 5

# 最少通过几何验证的候选数。
# 只有 ≥ min_candidates_to_accept 个候选通过时才认为存在有效回环。
# 设为 0 = 只要有一个候选通过就接受（宽松，可能误检）。
# 设为 > 1 = 要求多个候选一致（严格，减少误检但可能漏检）。
# 注意：当前实现即使设为 > 1，只要有 1 个候选通过就接受（仅用于日志提示）。
min_candidates_to_accept: 1

# 与最佳候选的比率阈值。
# 候选质量分低于 best_ratio × best_threshold 时被过滤。
# 设为 0.0 = 不过滤（宽松）。
# 设为 0.8-0.9 = 只选与最佳候选质量接近的（严格）。
# 建议值：0.0-0.8。
best_candidate_ratio_threshold: 0.8


# ================================================================
# 七、质量评分参数
# ================================================================
#
# 质量评分公式（loop_detector.cpp:764-766）：
#   quality_score = geometric_inliers * 1.0
#                 + inlier_ratio * matches.size() * 2.0
#                 + log1p(max(0, bow_score)) * 0.5
#
# 权重说明：
#   - geometric_inliers × 1.0：内点数量直接贡献
#   - inlier_ratio × matches × 2.0：内点率加权匹配数
#   - log1p(bow_score) × 0.5：BoW 分数的对数加权（对高分数进行平滑）
#
# 调参建议：
#   - 减少误检：提高 geometric_inliers 权重
#   - 优先高内点率：提高 inlier_ratio 权重
#   - 优先高 BoW 分数：提高 bow_score 权重

# 几何内点基础权重。
# 提高此值会优先选择内点数量多的候选。
geometric_inlier_weight: 1.0

# 内点率加权匹配数系数。
# 提高此值会优先选择高内点率的候选。
inlier_ratio_weight: 2.0

# BoW 分数对数权重。
# 提高此值会优先选择 BoW 分数高的候选（更可能是真正的回环）。
bow_score_weight: 0.5


# ================================================================
# 八、Sim3 尺度估计参数
# ================================================================
#
# 背景：Essential Matrix 只能得到归一化的平移方向，尺度信息丢失。
# Sim3 尺度估计：通过三角测量点的深度来估计相对位姿的真实尺度。
# 用里程计轨迹中两帧之间的实际距离来校准 EM 的归一化平移。
#
# 注意：此功能在 EM 平移向量接近 0 时触发（t_norm < 1e-3），
# 此时注入里程计尺度以获得更合理的相对位姿。

# 最小帧间距离（米），低于此值不注入里程计尺度（避免除零/噪声）。
# 设为 0.01m 过滤掉极近距离的帧。
frame_dist_min: 0.01

# 最大帧间距离（米），高于此值不注入里程计尺度（避免大尺度漂移）。
# 室内场景：10-20m；户外：50-100m。
frame_dist_max: 50.0

# ================================================================
# 八点五、DBoW2 查询与候选空间闸门（D5-e）
# ================================================================
#
# 这四项原来写死在 LoopDetector::detect() 里（R-018）：
#   queryWithConsistency(..., 3, 10, 1.0) 与 MAX_SPATIAL_DIST_FOR_LOOP = 8.0、frames_between < 30
#
# dbow_temporal_window：位置识别的时序窗口（候选必须在这几帧的邻居里也有支持）。
dbow_temporal_window: 3
#
# dbow_max_results：queryWithConsistency 最多返回多少候选（再多也没意义，几何验证才是瓶颈）。
dbow_max_results: 10
#
# dbow_min_distance_m：与当前帧空间距离小于此值的候选直接丢弃 —— 那是"还没走开"，不是回环。
dbow_min_distance_m: 1.0
#
# loop_max_spatial_dist_m：候选与当前帧空间距离超过它、**且**帧间隔小于下面那个值，
# 说明只是"路过同一个地方"而不是真的绕回来了，丢弃。
loop_max_spatial_dist_m: 8.0
#
# min_frames_between_for_spatial_gate：上面那道空间闸门只在帧间隔小于此值时启用。
# （帧间隔本来就大时，空间距离远是正常的，不该被砍。）
min_frames_between_for_spatial_gate: 30

# ----------------------------------------------------------------
# 八点六、回环检测节流（D4-d）
# ----------------------------------------------------------------
# 每多少个关键帧才做一次回环检测（连带一次 PGO）。
# 1 = 每个关键帧都检测（改动前的实际行为，默认）。
# 调大可以显著降 CPU：一次 detect() 要做 BoW 查询 + 几何验证 + Sim3/ICP，
# PGO 还是全局优化。代价是同一个回环要等更久才会被发现。
loop_check_interval_kf: 1


# ================================================================
# 九、候选一致性参数
# ================================================================
#
# 背景：多个候选之间应该在空间上接近（一致的回环）。
# 如果多个候选指向不同的历史位置，说明 BoW 匹配不可靠。
#
# 一致性计算公式（loop_detector.cpp:897-899）：
#   每个候选对：consistency = max(0, 1 - spatial_dist / 10.0)
#   总一致性 = 所有候选对的一致性平均值
#
# spatial_dist：两候选关键帧的 world pose 距离。
# max_spatial_dist：超过此距离认为不一致（米）。设为 10.0m。
# consistency_threshold：低于此阈值时输出警告（建议回环可能不可靠）。

# 计算候选一致性的最大空间距离阈值（米）。
# 两候选关键帧距离超过此值时，一致性贡献为 0。
max_spatial_dist_for_consistency: 10.0

# 一致性警告阈值。
# 多个候选之间一致性低于此值时，输出警告（建议回环可能不可靠）。
# 设为 0.0 禁用警告。
# 建议值：0.3-0.5。
consistency_warning_threshold: 0.5

# ================================================================
# 诊断输出
# ================================================================
# 回环检测在正常序列上"没找到回环"是常态，不是错误。
# 原实现有 60 处无条件 std::cerr，逐帧刷屏会淹没真正的失败信息（R-017/R-021）。
# 需要逐个候选看几何校验过程时设为 true；与 tracking.yaml 的 verbose_diag 独立。
verbose: false
