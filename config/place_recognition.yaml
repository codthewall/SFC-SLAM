%YAML 1.0
# ================================================================
# Place Recognition 配置文件
# 文件路径: config/place_recognition.yaml
# 模块: 回环检测 - DBoW2 风格位置识别
# ================================================================
#
# 功能说明：
#   PlaceRecognition 实现 DBoW2 风格的位置识别，用于：
#   1. 建立视觉词汇树（离线或在线）
#   2. 计算每帧的 Bag-of-Words (BoW) 向量
#   3. 在历史帧中检索 BoW 相似帧
#   4. 时序一致性检查（Temporal Consistency）
#   5. 困难样本学习（Hard Example Mining）
#
# 调参优先级：
#   P0: vocab_build_threshold（首次建词汇树时机）
#   P1: min_common_words, temporal_window
#   P2: hard_example 参数（在线学习）
#
# ================================================================

# ================================================================
# 一、词汇树参数
# ================================================================

# 词汇树建树阈值（关键帧数）。
# 积累 N 个关键帧后开始建立词汇树。
# 设为 0 = 立即建树。
# 建议值：
#   - 在线 SLAM：30-50（等待足够的帧再统计词频）
#   - 离线建树：0
vocab_build_threshold: 30

# 词汇树分支因子（k-means 的 k）。
# 每层节点分裂成 k 个子节点。
# k 越大词汇越细，区分度越高，但树越深。
# 设为 10 = 经典 ORB-SLAM2 参数。
# 建议值：
#   - 小场景（< 1000 关键帧）：6-10
#   - 大场景（> 1000 关键帧）：10-15
vocab_branching_factor: 10

# 词汇树深度（L）。
# 树的最大深度。
# 总词汇数 ≈ k^L。
# 设为 6 = 经典 ORB-SLAM2 参数。
# 建议值：5-8。
vocab_depth: 6

# K-means 最大迭代次数。
# 每层聚类的迭代上限。
# 设为 20 = 通常收敛。
# 建议值：10-30。
kmeans_max_iterations: 20

# 新词距离阈值。
# 当帧的 BoW vector 与现有词汇距离超过此值时，创建新词。
# 值越小越容易创建新词，词汇越丰富。
# 设为 0 = 禁用在线学习（使用预训练词汇）。
# 建议值：
#   - 在线学习开：25.0-40.0
#   - 预训练词汇：0
new_word_distance_threshold: 25.0


# ================================================================
# 二、匹配参数
# ================================================================

# 困难样本窗口大小。
# 收集最近 N 个匹配失败的帧作为困难样本。
# 这些样本用于在线学习（提高词汇区分度）。
# 设为 100 = 收集最近 100 个帧。
hard_example_window: 100

# 困难样本硬阈值（匹配距离）。
# 匹配距离超过此值时标记为困难样本。
# 设为 50.0 = 匹配距离 > 50 的帧作为困难样本。
hard_threshold: 50.0

# 时序一致性窗口大小。
# 回环候选必须在此窗口内的多帧中一致出现。
# 设为 3 = 需要最近 3 帧中至少 2 帧匹配同一历史帧。
# 设为 0 = 禁用时序一致性检查（宽松，可能误检）。
temporal_window: 3


# ================================================================
# 三、在线学习参数
# ================================================================
#
# 背景：预训练的词汇可能不能很好地覆盖特定场景。
# 在线学习：通过困难样本持续更新词汇树，提高区分度。
#
# 风险：在线学习可能导致词汇树偏移，降低长期稳定性。
# 建议：室内封闭场景可开启；户外大场景建议关闭（使用预训练词汇）。

# 是否启用在线学习。
# true = 启用困难样本学习（持续更新词汇树）。
# false = 禁用在线学习（使用预训练词汇）。
enable_online_learning: false

# IDF 权重更新间隔（关键帧数）。
# 每隔 N 个关键帧更新一次 IDF 权重。
# IDF 权重反映每个词在当前场景中的区分能力。
# 设为 10 = 每 10 帧更新一次。
idf_update_interval: 10

# 困难样本学习间隔（关键帧数）。
# 每隔 N 个关键帧尝试学习困难样本。
# 设为 50 = 每 50 帧尝试学习一次（避免学习过于频繁）。
hard_example_learn_interval: 50

# 触发学习的最小困难样本数。
# 只有收集到 ≥ N 个困难样本时才执行学习。
# 设为 20 = 需要至少 20 个困难样本才学习。
min_hard_examples_to_learn: 20

# 每次学习最多新增词汇数。
# 每次学习最多创建 N 个新词。
# 设为 50 = 避免词汇树膨胀过快。
max_new_words_per_learn: 50


# ================================================================
# 四、TF-IDF 权重参数
# ================================================================
#
# TF-IDF = Term Frequency × Inverse Document Frequency
# - TF：词在当前帧中出现的频率
# - IDF：词在所有帧中的罕见程度
#
# 公式：
#   score = Σ (tf_i × idf_i) for each common word
#
# 高 IDF 词（罕见词）权重高，更能区分不同位置。
# 低 IDF 词（常见词，如重复纹理）权重低，避免干扰。

# 是否使用 TF-IDF 权重。
# true = BoW 向量使用 TF-IDF 加权（推荐）。
# false = BoW 向量使用原始词频（简单，但区分度低）。
use_tfidf: true

# 是否使用 L1 范数归一化。
# true = BoW 向量归一化到 L1 = 1（推荐）。
# false = 不归一化（向量和可能差异大）。
normalize_l1: true


# ================================================================
# 五、候选评分参数
# ================================================================

# 时序一致性奖励权重。
# 候选在 temporal_window 内多次出现时给予额外分数奖励。
# 设为 0.2 = 每次一致性匹配增加 0.2 分。
# 设为 0 = 禁用一致性奖励。
consistency_bonus: 0.2

# 候选评分最小值（下限）。
# 评分低于此值的候选直接过滤掉。
# 设为 0.0 = 不过滤（所有候选都参与后续几何验证）。
min_candidate_score: 0.0
