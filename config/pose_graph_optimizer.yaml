%YAML 1.0
# ================================================================
# Pose Graph Optimizer 配置文件
# 文件路径: config/pose_graph_optimizer.yaml
# 模块: 回环检测 - 位姿图优化
# ================================================================
#
# 功能说明：
#   PGO 使用 g2o SE3 位姿图优化，利用里程计约束和回环约束
#   联合优化所有关键帧位姿。
#
# 约束类型：
#   1. 里程计边（Odometry Edge）
#      - 相邻关键帧之间的相对位姿约束
#      - 信息矩阵权重 = information_scale × inlier_ratio
#   2. 回环边（Loop Edge）
#      - 回环检测得到的相对位姿约束
#      - ICP 模式（有尺度）：平移约束 + 旋转约束
#      - EM 模式（无尺度）：仅旋转约束 + 弱平移方向约束
#
# 调参优先级：
#   P0: robust_kernel_delta（Huber 核阈值，决定鲁棒性）
#   P1: EM 模式平移信息权重（影响修正幅度）
#   P2: max_iterations（优化深度）
#
# ================================================================

# ================================================================
# 一、g2o 优化器参数
# ================================================================

# 最大迭代次数。
# 设为 0 = 不执行优化。
# 建议值：20-100。
# 这个值原样传给 optimizer_->optimize()（pose_graph_optimizer.cpp:1240），
# 代码里没有任何内部封顶 —— 旧注释写的 "取 min(max_iterations, 10)" 与实现不符，
# D6-a 一并更正（配置说明必须描述真实行为，否则调参等于猜）。
max_iterations: 50

# Huber 鲁棒核函数 delta 阈值（米）。
# 超过此误差的边的权重被降低（但不会完全丢弃）。
# 设为 2.5 = 2.5 米误差时开始降权。
# ★★★ 从 1.0 调整到 2.5：与 ORB_SLAM3 的 sqrt(5.991)≈2.448 一致。
#   1.0 过小，对 1m 级别的回环修正过度抑制，降低修正有效性。★
robust_kernel_delta: 2.5

# 是否输出优化过程详细信息。
# true = 输出每次迭代的误差变化。
# false = 静默模式。
verbose: false


# ================================================================
# 二、信息矩阵参数
# ================================================================
#
# 信息矩阵 = Σ^-1（协方差矩阵的逆）
# 对角线元素越大，该方向的约束越强
# 在 g2o 中，信息矩阵乘以误差的平方作为优化目标
#
# 信息矩阵格式（6×6 SE3）：
#   [info_t_x, 0,      0,      0,          0,          0        ]  ← 平移 x
#   [0,       info_t_y, 0,      0,          0,          0        ]  ← 平移 y
#   [0,       0,        info_t_z, 0,          0,          0        ]  ← 平移 z
#   [0,       0,        0,      info_r_x,   0,          0        ]  ← 旋转 x
#   [0,       0,        0,      0,          info_r_y,   0        ]  ← 旋转 y
#   [0,       0,        0,      0,          0,          info_r_z]  ← 旋转 z

# ---------- 里程计边信息矩阵 ----------
#
# 里程计边：相邻关键帧之间的约束
# 权重 = information_scale × inlier_ratio
# information_scale 基准 = 1.0

# 里程计边基准信息矩阵缩放因子。
# 设为 1.0 = 基准权重（建议不要修改，保持一致性）。
odom_information_scale: 1.0

# 里程计边最小信息矩阵缩放因子（下限，防止权重过低）。
# 设为 0.05 = 即使 inlier_ratio 很低，信息矩阵也有最小值。
odom_min_information_scale: 0.05


# ---------- 回环边信息矩阵（ICP 模式）----------
#
# ICP 模式：ICP 3D-3D 对齐成功
# - 有真实尺度约束（比 EM 更准确）
# - 平移和旋转都约束

# 回环边（ICP）平移信息权重。
# ICP 有真实尺度，约束平移。
# ★★★ 从 1.0 提升到 5.0：即使 ICP 内点少，ICP 旋转+里程计尺度的混合策略
#    仍应主导 PGO 优化，确保回环修正轨迹尺度
icp_trans_info: 5.0

# 回环边（ICP）旋转信息权重。
# ★★★ 从 0.5 提升到 1.0：ICP 有真实尺度，旋转约束与里程计同等重要
icp_rot_info: 1.0


# ---------- 回环边信息矩阵（Essential Matrix 模式）----------
#
# EM 模式：Essential Matrix 几何验证通过
# - 无真实尺度（平移向量归一化）
# - 只有旋转方向约束 + 弱平移方向约束
#
# 问题：平移信息 = 0 时，回环边完全无平移约束，
#       PGO 可能产生过大的尺度修正（拉偏轨迹）。
#
# 解决方案：注入弱平移方向约束（0.05），
#           让回环边有轻微的平移修正方向，但不主导尺度。

# 回环边（EM）旋转信息权重。
# 旋转比平移更可靠（Essential Matrix 旋转不受尺度影响）。
# 实际权重 = rot_info × max(0.1, inlier_ratio × 2.0)
# ★★★ 从 0.5 提升到 1.0：旋转约束应与里程计同等重要
em_rot_info: 1.0

# 回环边（EM）平移信息权重（弱方向约束）。
# ★★★ 从 0.05 提升到 0.2：原值太小（仅为里程计的 1/6），导致回环修正量 max|t|=0.0m
#   0.2 是里程计的 8 倍，足以克服多帧累积的里程计漂移
# 注意：此值应远低于里程计边的平移信息（0.3），
#       因为 EM 的平移方向本身有误差。
em_trans_info: 0.2

# EM 旋转信息最低缩放因子。
# 实际旋转信息 = em_rot_info × max(0.1, inlier_ratio × 2.0)
# 设为 0.1 = 即使 inlier_ratio 很低，旋转信息也有最小值。
em_min_rot_scale: 0.1

# EM 平移信息最低值。
# 确保即使 inlier_ratio 很低，平移信息也有最小值（防止完全无约束）。
em_min_trans_info: 0.05


# ---------- 信息矩阵缩放 ----------
#
# 回环边的最终信息矩阵 = info × information_scale × 内点率因子
# 此缩放因子是所有回环边的全局乘数

# 回环边基准信息矩阵缩放因子。
# 设为 1.0 = 基准权重。
# ★★★ 从 1.0 提升到 2.0：增强回环约束权重，使 PGO 修正更有效
loop_information_scale: 2.0

# 回环边最小信息矩阵缩放因子（下限）。
loop_min_information_scale: 0.05

# ----------------------------------------------------------------
# D4-a：回环边按"内点对数"加权
# ----------------------------------------------------------------
# 一个回环被 n 对观测支持时，位姿估计的信息矩阵按 n 增长（方差按 1/n 收缩）。
# 此前只有内点率的一次项，于是"2 对全内点"和"200 对全内点"拿到同样的权重 ——
# 最直接的置信度信号被丢掉了。
#
# 计数因子 = 内点数 / loop_inlier_count_ref，再夹在 [min, max] 之间。
# loop_inlier_count_ref: 30   → 30 对以上内点的回环权重开始超过基准
# loop_inlier_count_min_factor: 0.25 → 观测极少的回环最弱只能拿到基准的 1/4
# loop_inlier_count_max_factor: 4.0  → 特别结实的回环最多拿到 4 倍，避免淹没相邻约束
loop_inlier_count_ref: 30.0
loop_inlier_count_min_factor: 0.25
loop_inlier_count_max_factor: 4.0

# ----------------------------------------------------------------
# D4-c：里程计边的信息缩放区间
# ----------------------------------------------------------------
# 原来写死 std::min(2.0, std::max(0.5, ...))，把 30% 内点与 90% 内点的里程计边
# 压成几乎同一权重。回环修正只能通过里程计边传播，区间压平等于削弱整张图的响应。
# 下面的 odom_min_information_scale 仍是硬下限（烂边不会被彻底忽略）。
odom_info_scale_min: 0.2
odom_info_scale_max: 4.0


# ================================================================
# 三、PGO 修正阈值
# ================================================================
#
# 注意：PGO 修正阈值目前在 covis_manager.cpp 中硬编码，
# 建议移动到此处以实现 YAML 配置化。
# 具体参数见 covis_manager.yaml：
#   - pgo_max_allowed_trans_corr: 0.5m
#   - pgo_max_allowed_rot_corr_deg: 180.0
#   - pgo_warn_trans_corr: 0.3m
#   - pgo_warn_rot_corr_deg: 45.0


# ================================================================
# 四、PGO 迭代策略（D6-a 后已并入上面的 max_iterations）
# ================================================================

# D6-a：这里原本有一个 effective_max_iterations: 30，但全仓没有任何代码读取它
# （grep 只在 yaml 自身命中），是个纯粹的假旋钮 —— 改它不会有任何效果，而注释
# 又声称"实际代码中取 min(max_iterations, 10)"，与 pose_graph_optimizer.cpp:1240
# 的 `optimizer_->optimize(opts_.max_iterations)` 也不符。
# 已删除该键，迭代深度只由上面的 max_iterations 决定（单一来源，R-023）。
