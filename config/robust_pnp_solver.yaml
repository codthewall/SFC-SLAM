%YAML 1.0
# ================================================================
# Robust PnP Solver 配置文件
# 文件路径: config/robust_pnp_solver.yaml
# 模块: 前端 - 鲁棒 PnP 位姿求解
# ================================================================
#
# 功能说明：
#   RobustPnPSolver 使用 RANSAC + 迭代扩展 + g2o Bundle Adjustment
#   求解相机位姿：
#
#   流程：
#   1. RANSAC EPnP 估计初始位姿（200 次迭代，阈值 8px）
#   2. 迭代扩展（2 轮，每轮扩大阈值 1.5×）
#   3. g2o BA 精化位姿（15 次迭代，Huber 核函数）
#   4. 质量评估（EXCELLENT/GOOD/ACCEPTABLE/POOR）
#
# ================================================================

# ================================================================
# 一、RANSAC 参数
# ================================================================

# RANSAC 最大迭代次数。
# 迭代越多找到正确解的概率越高，但计算量越大。
# 室内场景（内点率 30-50%）：200-500 次。
# 户外场景（内点率 50-80%）：100-200 次。
# ★★★ 从 200 提高到 500：TUM desk 室内场景内点率偏低，增加迭代次数能更稳定找到正确解 ★★★
max_ransac_iterations: 500

# RANSAC 初始内点阈值（像素）。
# 第一轮 RANSAC 使用的重投影误差阈值。
# 值越大越宽松，内点越多，但初始解越不准确。
# 室内近距离：6-10px。
# 户外远距离：8-15px。
# ★★★ 从 6.0 放宽到 10.0：低内点率场景需要更宽松的初始阈值 ★★★
initial_inlier_thresh_px: 10.0

# RANSAC 最终内点阈值（像素）。
# 迭代扩展后使用的阈值（比初始更严格）。
# 设为 4.0px 是经过调优的值，比初始阈值（6.0px）严格。
# ★★★ 从 4.0 收紧到 3.0：更严格的内点筛选，减少漂移累积 ★★★
final_inlier_thresh_px: 3.0

# RANSAC 置信度（成功概率）。
# 设为 0.999 = 99.9% 的概率找到正确的内点集。
confidence: 0.999

# 最低内点率阈值。
# RANSAC 找到的内点率低于此值时返回 FAILED。
# 室内场景：0.05-0.10。
# ★★★ 从 0.05 降低到 0.03：极低内点率场景需要更宽容 ★★★
min_inlier_ratio: 0.03


# ================================================================
# 二、自适应阈值参数
# ================================================================
#
# 背景：不同场景的内点率差异很大（室内 30-50%，户外 50-80%）。
# 固定阈值会导致室内场景总是找到不到足够内点。
#
# 自适应阈值策略（robust_pnp_solver.cpp:374-383）：
#   inlier_ratio > 0.6  → thresh = 4.0px（收紧）
#   inlier_ratio > 0.3  → thresh = initial_inlier_thresh_px
#   inlier_ratio > 0.1  → thresh = 8.0px
#   inlier_ratio ≤ 0.1  → thresh = 10.0px
# ★★★ 调整边界：原来 >0.6 对应 5.0px，现在收紧到 4.0px，与 final_inlier_thresh_px=3.0 配合 ★★★

# 是否启用自适应阈值。
# true = 根据当前内点率动态调整 RANSAC 阈值。
# false = 使用固定 initial_inlier_thresh_px。
use_adaptive_threshold: true


# ================================================================
# 三、迭代扩展参数
# ================================================================
#
# 背景：RANSAC 第一轮可能找到的是局部最优解（内点率偏低）。
# 迭代扩展：用第一轮找到的内点子集重新 RANSAC，
#          如果内点率提高了，就接受新解并再次扩大阈值迭代。
#
# 示例（threshold=8, expansion_factor=1.5）：
#   初始阈值：8.0px
#   第 1 轮扩展：8.0 * 1.5 = 12.0px → 可能有更多内点
#   第 2 轮扩展：12.0 * 1.5 = 18.0px → 通常到此为止

# 迭代扩展轮数。
# 设为 0 = 禁用迭代扩展（只做一轮 RANSAC）。
# 室内场景建议 2-3 轮。
expansion_rounds: 2

# 每轮扩展的阈值乘数。
# 设为 1.0 = 禁用扩展（每轮用相同阈值）。
# 设为 1.5 = 每轮阈值扩大 1.5 倍。
expansion_factor: 1.5


# ================================================================
# 四、Bundle Adjustment 参数
# ================================================================

# BA 最大迭代次数（Levenberg-Marquardt）。
# 设为 0 = 禁用 BA（只使用 RANSAC EPnP 结果）。
# 建议值：10-20。
ba_max_iterations: 15

# 是否使用 Huber 鲁棒核函数。
# true = 使用 Huber 核函数降低外点权重（推荐）。
# false = 使用二次核函数（对外点敏感）。
use_huber_kernel: true

# Huber 核函数 delta 值（像素）。
# 超过此误差的点的权重被降低（但不会完全丢弃）。
# ★★★ 从 3.0 改为 2.45：与 ORB_SLAM3 Optimizer.cc:852 一致 ★★★
# ORB_SLAM3: deltaMono = sqrt(5.991) ≈ 2.45
# chi2Mono = 5.991 = χ²(2, 0.95)，自由度2，95%置信区间上限
huber_delta: 2.45

# 是否使用深度加权。
# ★★★ 设为 false：BA 中已移除深度加权（关键 Bug 修复）★★★
# 错误原因：info_scale = fx²/z² 按深度平方放大远处点 chi2，
# 导致远处点（z=5m）chi2 被放大 ~10000 倍，总是错误判定为外点。
# 正确方法：与 ORB_SLAM3 一致，只用信息矩阵 = Identity。
use_depth_weighting: false

# 是否启用联合点优化（实验性）。
# true = BA 时同时优化位姿和地图点（更精确但更慢）。
# false = 只优化位姿（更快，标准方法）。
# 注意：联合优化可能导致地图点坐标偏移，需要谨慎使用。
joint_point_optimization: false


# ================================================================
# 五、质量评估参数
# ================================================================
#
# 质量评估标准（assessQuality 函数）：
#
#   EXCELLENT:  内点率 > 0.7, 内点数 > 30, 中位误差 < 3.0px
#   GOOD:       内点率 > 0.5, 内点数 > 15, 中位误差 < 5.0px
#   ACCEPTABLE: 内点率 > 0.3, 内点数 > 8,  中位误差 < 8.0px
#   POOR:       其他情况
#   FAILED:     PnP 求解失败或内点数 < 4
#
# 调参建议：
#   - 室内低内点率场景 → 降低 ACCEPTABLE 阈值
#   - 户外高内点率场景 → 提高 GOOD/EXCELLENT 阈值

# EXCELLENT 质量内点率阈值。
excellent_inlier_ratio: 0.7

# EXCELLENT 质量最小内点数。
excellent_min_inliers: 30

# EXCELLENT 质量最大中位误差（像素）。
excellent_max_median_error: 3.0

# GOOD 质量内点率阈值。
good_inlier_ratio: 0.5

# GOOD 质量最小内点数。
good_min_inliers: 15

# GOOD 质量最大中位误差（像素）。
good_max_median_error: 5.0

# ACCEPTABLE 质量内点率阈值。
acceptable_inlier_ratio: 0.3

# ACCEPTABLE 质量最小内点数。
acceptable_min_inliers: 8

# ACCEPTABLE 质量最大中位误差（像素）。
acceptable_max_median_error: 8.0


# ================================================================
# 六、输出控制
# ================================================================

# 是否输出详细日志。
# true = 输出 PnP 求解过程的详细信息（RANSAC 迭代、内点、误差等）。
# false = 静默模式（只输出最终结果或错误）。
verbose: false
