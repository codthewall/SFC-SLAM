%YAML 1.0
# ================================================================
# Tracking 配置文件
# 文件路径: config/tracking.yaml
# 模块: 前端 - 视觉里程计跟踪
# ================================================================
#
# 功能说明：
#   Tracking 模块负责：
#   1. 特征提取（ORB）
#   2. 帧间特征匹配
#   3. PnP 位姿求解（Robust PnP + g2o BA）
#   4. 关键帧判定（运动阈值 + 静止死区）
#   5. 相对位姿 EMA 平滑
#   6. 地图管理与回环检测接入
#
# ================================================================

# ================================================================
# 一、深度处理参数
# ================================================================

# 深度缩放因子，PNG 像素值 ÷ factor = 深度（米）
# TUM RGB-D 官方格式：PNG 以 depth_mm / 5 存储（factor=5000）。
#   depth_scale = 1/5000 = 0.0002
# Kinect v1/freiburg1：
#   原始 raw ≈ 5933，对应 depth = 5933 * 0.0002 = 1.1866m（约1.2m，合理）
# 注意：
#   1. 此参数在 tracking.yaml 中定义，由 TrackingConfig 加载。
#   2. test_tum_rgbd 也走这里（--depth_scale 仅用于临时覆盖），
#      不再有"命令行默认值 + yaml 值"两套（R-019）。
depth_scale: 0.0002

# 最小有效深度（米）。
# 小于此深度的点被过滤（太近的深度不可靠）。
min_depth: 0.1

# 最大有效深度（米）。
# 大于此深度的点被过滤（太远的点噪声大）。
# freiburg1_desk2 全局均值≈6.158m，最大11m，设为12m 覆盖全部有效点。
# 户外场景可设为 20-50m。
max_depth: 12.0

# 深度梯度阈值（米/像素）。
# 深度梯度超过此值的点被视为边界/跳跃区域，被过滤。
# 设为 0.0 禁用深度边缘过滤。
depth_edge_thresh: 0.2


# ================================================================
# 二、特征提取参数
# ================================================================
#
# 归属：config/feature_extractor.yaml（OctreeORBConfig 的唯一来源）。
# 本文件不再重复写 n_features / scale_factor / n_levels / fast_threshold /
# edge_threshold —— 同一参数存在两个来源时，改了一个另一个不生效，
# 调试时会误判"参数改了但行为没变"（R-019）。
#
# 已删除的 dead key（没有任何 C++ 消费点，删掉不产生行为变化）：
#   enable_uniform / grid_cols / grid_rows / max_per_grid
#   —— OctreeORBConfig 里没有这些字段；实现用 ORB-SLAM3 四叉树而非网格。


# ================================================================
# 三、特征匹配参数
# ================================================================
#
# 归属：config/feature_matcher.yaml（MatcherConfig 的唯一来源）。
# 本文件不再重复写 lowe_ratio / max_match_dist。
#
# 已删除的 dead key（没有任何 C++ 消费点）：
#   matcher_type / bidirectional_match / min_dist_slack
#   —— MatcherConfig 里没有这些字段；匹配器固定 BFMatcher(NORM_HAMMING)，
#      交叉一致性由 cross_check 控制，没有 min_dist + slack 的松弛逻辑。


# ================================================================
# 四、PnP 求解参数
# ================================================================
#
# Robust PnP 使用 RANSAC + 迭代扩展 + g2o BA 求解相机位姿。
# 具体参数在 robust_pnp_solver.yaml 中配置（通过子结构传入）。
# 以下为 Tracking.cpp 中的运行时覆盖参数。
# PnP 最大 RANSAC 迭代次数。
pnp_max_ransac_iterations: 200

# PnP 初始内点阈值（像素）。
# RANSAC 第一轮使用的重投影误差阈值。
# ★★★ 从 6.0 放宽到 10.0：低内点率场景需要更宽松的初始阈值 ★★★
pnp_initial_thresh_px: 10.0

# PnP 最终内点阈值（像素）。
# 迭代扩展后使用的最终阈值（更严格）。
pnp_final_thresh_px: 3.0

# PnP 迭代扩展轮数。
pnp_expansion_rounds: 2

# PnP 阈值扩展因子。
# 每次迭代将阈值乘以此因子。
pnp_expansion_factor: 1.5

# PnP BA 最大迭代次数。
pnp_ba_max_iterations: 15

# PnP 是否使用 Huber 鲁棒核函数。
pnp_use_huber_kernel: true

# Huber 核函数 δ 值（像素）。
# 超过此误差的点被视为外点并降权。
# ▼从 5.0 改为 2.45：与 ORB_SLAM3 Optimizer.cc:852 一致。▼
# ORB_SLAM3 标准：deltaMono = sqrt(5.991) ≈ 2.45
# 5.0 过于宽松，会导致异常点权重降得不够，在 BA 中仍然影响精度。
pnp_huber_delta: 2.45

# PnP 是否使用深度加权（近点权重高）。
# ▼建议设为 false，BA 中已弃用此参数，关键 Bug 已修复。▼
# 错误原因：info_scale = fx²/z² 放大远处点 chi2，导致远处点被错误剔除。
# 正确方法：与 ORB_SLAM3 一致，使用统一信息矩阵 Identity。
pnp_use_depth_weighting: false


# ================================================================
# 五、关键帧判定参数
# ================================================================
#
# 关键帧判定策略：
# 1. 运动阈值判定：当帧间平移 > min_keyframe_translation 或
#                 帧间旋转 > min_keyframe_rotation 时插入关键帧
# 2. 运动乖数：根据 PnP 内点质量动态调整阈值（内点率越高阈值越宽松）
# 3. 强制关键帧：每隔 N 帧强制插入一个（防止静止时无关键帧）
# 4. 静止死区：当平移和旋转都小于阈值时，认为相机静止
# 关键帧最小平移阈值（米）。
# 当帧间平移超过此值时插入关键帧。
# ▼从 0.15m 改为 0.20m：减少不必要的关键帧，提高每帧关键帧质量▼
# 室内手持场景建议：0.15-0.25m
# 户外/机器人移动建议：0.2-0.5m
# ★★★ 修复：室内场景应设为 0.15m，保证关键帧分布合理 ★★★
min_keyframe_translation: 0.15

# 关键帧最小旋转阈值（弧度）。
# 当帧间旋转超过此值时插入关键帧。
# ▼从 0.1 rad (5.7°) 提高到 0.15 rad (8.6°)：减少不必要关键帧
min_keyframe_rotation: 0.05

# 最小特征点数。
# 当前帧特征点数低于此值时强制插入关键帧（保证地图构建）。
min_features: 50

# 强制关键帧插入间隔（帧数）。
# 每隔 N 帧强制插入一个关键帧（防止静止时无关键帧）。
# ▼从 0 改为 100：保证静止时地图点持续构建。
# 室内场景（TUM 30fps）：100 帧约对应 3.3 秒，对于手持运动场景足够密集。
# 设为 0 = 禁用强制插入。
# 室内场景建议：100-300。
# ★★★ 纯 VO 模式：设为 30（约 1 秒@30fps），平衡地图密度 ★★★
forced_keyframe_interval: 30


# ----------------------------------------------------------------
# 关键帧插入的间隔下限（本次修复新增）
# ----------------------------------------------------------------
#
# 背景：freiburg1_desk2 实测 640 帧插出 562 个关键帧（88%）。
# 原因不是阈值调得松，而是判定里根本没有"间隔下限"：
#   - 旧 c1b: 距上一关键帧 >= 10 帧 → 无条件插帧；
#   - 旧 c1c: 内点数 < max(10, 参考点*0.25) || 近距离点太少 → 无间隔下限，
#             而"近距离"用的阈值是 max_depth*4.0(=48m)，全部点都算近，
#             于是该条件长期为真。
# 关键帧一密，局部地图窗口（原固定 20）里全是零视差的相邻帧，
# 三角化退化，位姿就再也拉不回来。
#
# 判定本体在 include/sfc_core/frontend/keyframe_policy.hpp 的 decideKeyframe()。

# 两个关键帧之间的最小帧间隔（硬下限）。只有"强制插入"和"兜底插入"能越过它。
# 30fps 手持场景建议 8-15。
min_keyframe_gap_frames: 8

# 内点绝对数量充足线：内点数高于此值时不因"相对内点率下降"而插帧。
keyframe_min_tracked_inliers: 120

# 内点率下降判据：内点数 < 参考关键帧活着的地图点数 × 此比例 → 视为跟踪退化。
keyframe_weak_tracked_ratio: 0.30

# 兜底插入：内点数长期不高于 rescue_min_inliers 且已间隔 rescue_max_gap 帧时插一帧。
# rescue_max_gap 建议取 forced_keyframe_interval 的 2 倍。
keyframe_rescue_min_inliers: 40
keyframe_rescue_max_gap: 60


# ----------------------------------------------------------------
# 局部地图与建点配额（本次修复新增）
# ----------------------------------------------------------------

# 局部关键帧窗口大小。原值硬编码 20，配 562 个关键帧时窗口只覆盖不到 1 秒的视角。
local_map_keyframe_window: 40

# 新建地图点的观察期（帧）。原值硬编码 3：关键帧建点时 obs_count=1，
# 3 帧内没被第二次观测到就整批判坏，地图永远长不起来。
map_point_grace_frames: 8

# 单个关键帧最多新建的地图点数。原值硬编码 100，且按深度升序截断，
# 远处结构点永远拿不到名额。上限仍然必要（否则每帧可建 ~2000 点，地图膨胀到百万级）。
max_new_map_points_per_kf: 300

# poseOptimization 的内点下限（本次修复新增，此前只写在 TrackingConfig 里、无 YAML 入口）。
# 原值 5 意味着 5 个点就敢接受 6 自由度解。正常跟踪一帧应有数百内点。
pose_opt_min_inliers: 20


# ================================================================
# 六、相对位姿 EMA 平滑参数
# ================================================================
#
# 背景：PnP 输出的帧间位姿包含噪声，尤其是静止时的亚像素抖动。
# 这些噪声会被累积成明显的阶梯。
#
# EMA 平滑：对 PnP 输出的 t 做指数移动平均，抑制抖动。
#   rel_t_ema = alpha * rel_t_pnp + (1 - alpha) * rel_t_ema_prev
#
# 注意：EMA 仅用于静止死区判断，不参与 PnP 初值或世界位姿构建。
#
# ⚠️ 本组键在纯 VO 路径（Tracking）下当前无消费者：tracking.cpp 里没有任何
#    读取 relative_t_ema_alpha / stationary_* 的分支。保留是因为 covis_manager
#    那条链路仍可能需要，但调这些值不会改变 test_tum_rgbd 的行为（R-022）。
# 关键帧相对位移 EMA 平滑系数。
# 0.0 = 关闭 EMA（直接使用 PnP 输出）。
relative_t_ema_alpha: 0.0


# ================================================================
# 七、静止死区参数
# ================================================================
#
# 背景：相机静止时 PnP 输出包含亚像素级噪声，会被累积成明显的阶梯。
#
# 静止死区：当 EMA 平滑后平移 < 阈值且旋转 < 阈值时，
#          将帧相对位姿置为零（不更新世界位姿）。
#
# 建议：先开 EMA，再开死区。阈值约 0.5mm 量级。
# 是否启用静止死区。
# true = 启用静止检测和死区。
# false = 禁用（可能导致静止时抖动累积）。
# ⚠️ 同上一节：纯 VO 路径没有消费者，改这里不会改变 test_tum_rgbd 的行为（R-022）。
stationary_deadzone_enabled: false

# 静止平移死区阈值（米）。
# EMA 平滑后平移 < 此值时认为相机静止。
# ▼从 0.0005m (0.5mm) 改为 0.003m (3mm)：原值过于敏感
# 室内手持（静止时亚毫米抖动）：0.002-0.005
# 机器人移动（持续运动）：
stationary_trans_deadzone_m: 0.003

# 静止旋转死区阈值（弧度）。
# 旋转 < 此值时认为相机静止。
# 设为 0.002 rad ≈ 0.11°。
stationary_rot_deadzone_rad: 0.002


# ================================================================
# 八、运动先验参数（⚠️ 当前未接线）
# ================================================================
#
# 背景：长时间静止后第一帧往往 PnP 初值为单位阵，
# 如果接着用上一帧相对位姿作 g2o 初值，噪声被放大导致轨迹突然跳出。
#
# 运动先验热启动：检测到"刚结束一段静止"后，
#                连续多帧强制 PnP 初值为单位阵，
#                等 PnP 收敛到稳定值后再恢复正常先验。
#
# ⚠️ 本节三个键没有任何 C++ 消费点，也不在 TrackingConfig 里（R-022）。
#    保留写法只为记录当初的设计意图；真正接线时必须在同一改动里补
#    结构体字段 + loader + 消费者，否则先把它们删掉。

# 静止结束后运动先验热启动帧数（未接线）。
motion_prior_warmup_frames: 6

# 触发热启动的最少连续死区帧数（未接线）。
min_consecutive_deadzone: 8

# 用作 PnP 初值的上一帧相对平移上限（未接线）。
motion_prior_max_translation_m: 0.05


# ================================================================
# 九、后台调参开关
# ================================================================

# 注：enable_pgo / enable_local_ba 两个键已从本文件移除。
# 原因：纯 VO 路径（Tracking）不消费这两个开关——它没有 CovisManager 实例，
# 也没有 PGO 调用点。真正的拥有者是
#   config/pose_graph_optimizer.yaml  (PoseGraphOptimizerOptions)
#   config/covis_manager.yaml         (CovisConfig)
# 在本文件里再写一份，只会造成"配置了却不生效"的假象（R-019）。

# 详细诊断日志开关（默认 true）。
# true = 打印每帧 PnP 内点率、REJECT 原因、YAML 加载等诊断信息。
# false = 只打印关键事件（轨迹输出、evo 评估等）。
# 注意：控制的是过程量；错误与异常日志不受此开关影响（R-021）。
verbose_diag: true

# 禁用关键点去畸变（R3 之后默认关闭，即 false = 做去畸变）。
# 坐标系分工只有一个决定点：trackFrame() 的 Step 4 产出 undistorted_keypoints。
#   false: 对 keypoints 应用 cv::undistortPoints 后重新像素化 → 理想像素。
#          3D 点用畸变像素采样深度（深度图与畸变 RGB 对齐）、用理想像素反投影；
#          2D 观测也是理想像素，与 g2o 标准针孔投影模型一致。这是正确配置。
#   true : 跳过去畸变，undistorted_keypoints = keypoints（原始/畸变像素）。
#          只有在 D 为空（相机已无畸变）时才是物理正确的，否则 2D/3D 两侧
#          会同时用畸变像素，"自洽"地把真实的方向偏差掩盖掉。
disable_undistort: false


# ================================================================
# 十、相机内参
# ================================================================
#
# 内参不再放在本文件里。K/D 由独立的相机标定文件承载，按数据集切换：
#   config/camera_fr1.yaml   TUM RGB-D freiburg1
#   config/camera_fr2.yaml   TUM RGB-D freiburg2
#   config/camera_fr3.yaml   TUM RGB-D freiburg3（已校正，D=0）
#
# 使用方式：
#   test_tum_rgbd --dataset <path> --camera config/camera_fr1.yaml
#
# 历史问题：这里曾同时存在 fr2 的 camera_fx/camera_d0..d4 默认值和
# test_tum_rgbd.cpp 里硬编码的 fr1 值，两套值互相覆盖、谁生效取决于调用路径，
# 由此产生过"yaml 写着 fr2、实际跑 fr1"的静默错配（R-019 反例）。
